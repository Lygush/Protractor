; PlatformIO Project Configuration File — Protractor Flash Writer
; Одноразовый (или перезаписываемый по необходимости) инструмент:
; прошивает DMP-блоб, шрифт и иконки на внешнюю W25Q32.
; Собирается и заливается на ТУ ЖЕ плату LGT8F328P, к которой физически
; подключён модуль флешки (CS=D10, SCK=D13, MISO=D12, MOSI=D11).
;
; После успешной прошивки flash и проверки заголовка в Serial Monitor —
; заливаем на плату уже основную прошивку Protractor (не этот проект).

[env:LGT8F328P]
platform = lgt8f
board = LGT8F328P
framework = arduino
monitor_speed = 115200
build_flags =
	-ffunction-sections
	-fdata-sections
	-Wl,--gc-sections
